<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourSetu | Travel Agency Portal</title>
    
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.js" defer></script>
    <script>
      window.OneSignal = window.OneSignal || [];
      OneSignal.push(function() {
        OneSignal.init({
          appId: "1d58b571-868b-4b5b-b370-cd417cac6c28",
          allowLocalhostAsSecureOrigin: true,
          serviceWorkerParam: { scope: "/" },
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <style>
        /* FORCE CALENDAR VISIBILITY & STYLE */
        input[type="date"] {
            appearance: auto !important;
            -webkit-appearance: listbox !important;
            min-height: 50px;
            cursor: pointer;
            background-color: #ffffff !important;
            color: #2d3436 !important;
            font-family: 'Inter', sans-serif;
            position: relative;
            border: 2px solid #ff9f43 !important;
            display: block !important;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Calendar Icon for Chrome/Edge/Windows 7 */
        input[type="date"]::-webkit-calendar-picker-indicator {
            background-color: #ff9f43;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            display: block !important;
            opacity: 1 !important;
        }

        #detail-modal {
            z-index: 999999 !important;
        }

        .modal-content {
            z-index: 1000000 !important;
        }

        /* Refund Policy Checkbox Styling */
        .policy-container {
            margin-top: 20px;
            padding: 15px;
            background: #fff5f5;
            border: 1px solid #ff7675;
            border-radius: 10px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .policy-container input {
            width: 20px !important;
            height: 20px !important;
            margin-top: 4px !important;
            cursor: pointer;
        }

        /* Hotel Sidebar Styling */
        .nav-item {
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
            color: #d1d5db;
        }
        .nav-item:hover {
            background: #374151;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="auth-card">
        <h1 id="form-title">🌍 Tour<span style="color: #ff9f43;">Setu</span></h1>
        
        <div id="auth-section">
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            
            <div id="role-selection">
                <label>I am a:</label>
                <select id="role" onchange="toggleBusinessFields()">
                    <option value="customer">Traveler</option>
                    <option value="agency">Travel Agency</option>
                    <option value="hotel">Hotel Partner</option>
                </select>
            </div>

            <div id="business-fields" style="display:none; margin-top:10px; border-top:1px solid #eee; padding-top:10px;">
                <input type="text" id="gst-no" placeholder="GST Number">
                <input type="text" id="biz-reg" placeholder="Business Registration No.">
                <input type="text" id="biz-lic" placeholder="Trade License / License No.">
                <p style="font-size:0.75rem; color:#666; margin-top:5px;">
                    Note: Partner accounts require verification to go public.
                </p>
            </div>

            <button id="auth-btn" onclick="handleAuth()">Create Account</button>
            
            <p id="toggle-text">
                Already have an account? <a href="javascript:void(0)" onclick="toggleMode()">Login here</a>
            </p>
        </div>
        
        <div id="status" style="margin-top:15px; font-weight:bold;"></div>

        <!-- MY REQUESTS SECTION -->
        <div id="my-requests-section" style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <h3>My Requests</h3>
            <div id="requests-list">
                <!-- Yahan JavaScript se requests dynamic load hongi -->
            </div>
        </div>
    </div>
</div>

<!-- LIVE HOTEL INVENTORY CONTAINER (JS will render items here) -->
<div id="live-hotel-inventory-list"></div>

<!-- SIDEBAR NAVIGATION TEMPLATE (Used dynamically when Hotel Login happens) -->
<template id="hotel-sidebar-template">
    <nav style="display: flex; flex-direction: column; gap: 5px;">
        <div onclick="showHotelTab('overview')" class="nav-item">📊 Dashboard</div>
        <div onclick="showHotelTab('property')" class="nav-item">🏨 Room Inventory & Lock</div>
        <div onclick="showHotelTab('requests')" class="nav-item">📥 Booking Inbox</div>
    </nav>
</template>

<!-- Hotel Owner Dashboard UI (Initially Hidden) -->
<div id="owner-dashboard-section" style="display: none; max-width: 800px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2>Incoming Booking Requests</h2>
    
    <!-- Refresh Button -->
    <button onclick="fetchAndRenderOwnerRequests(window.currentHotelId)" style="padding: 10px 15px; background: #ff9f43; color: white; border: none; border-radius: 6px; cursor: pointer;">
        🔄 Fetch/Refresh Requests
    </button>

    <!-- Requests Display List -->
    <div id="owner-requests-list" style="margin-top: 15px;">
        <!-- Javascript dynamic cards yahan render karega -->
    </div>
</div>

<div id="detail-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:start; overflow-y:auto; padding:20px;">
    <div class="modal-content card" style="background:white; width:100%; max-width:750px; padding:30px; border-radius:20px; position:relative; margin: 40px auto;">
        <div id="detail-view-body"></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
