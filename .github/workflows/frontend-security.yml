name: Frontend Security Regression

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'security-*'
  pull_request:
    branches: [main]

jobs:
  xss-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check static HTML for inline execution sinks
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          forbidden = [
              r"\bon(?:click|change|submit|error|load|mouseover|focus|blur)\s*=",
              r'''href\s*=\s*["']\s*javascript:''',
          ]
          for pattern in forbidden:
              if re.search(pattern, html, re.I):
                  raise SystemExit(f"Security regression: forbidden inline execution sink: {pattern}")
          print("OK: index.html has no checked inline event/javascript-URL sinks.")

      - name: Check migrated customer agency request renderer
        shell: python
        run: |
          from pathlib import Path
          import re
          js = Path("script.js").read_text(encoding="utf-8")
          start_marker = "🎒 AGENCY PACKAGES - MY REQUESTS"
          end_marker = "🎒 AGENCY BOOKING PAYMENT"
          start = js.find(start_marker)
          end = js.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Security regression: migrated customer agency request renderer markers missing.")
          block = js[start:end]
          forbidden = [
              r"innerHTML\s*=",
              r"insertAdjacentHTML\s*\(",
              r"\bon(?:click|change|input|error|load|submit|mouseover|focus|blur|keyup|keydown)\s*="
          ]
          hits = [pattern for pattern in forbidden if re.search(pattern, block, re.I)]
          if hits:
              raise SystemExit("Security regression: migrated agency request renderer still contains: " + ", ".join(hits))
          required = ["textContent", "createElement", "addEventListener", "data-agency-request-action"]
          missing = [item for item in required if item not in block]
          if missing:
              raise SystemExit("Security regression: migrated agency request renderer missing: " + ", ".join(missing))
          print("OK: customer agency request renderer uses safe DOM/event APIs.")
      - name: Check migrated customer agency package renderer
        shell: python
        run: |
          from pathlib import Path
          import re
          js = Path("script.js").read_text(encoding="utf-8")
          start_marker = "// 7. MATCHING & CARD RENDERING — XSS-safe DOM implementation"
          end_marker = "PACKAGE DETAIL / CUSTOMER BOOKING MODAL"
          start = js.find(start_marker)
          end = js.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Security regression: migrated customer agency package renderer markers missing.")
          block = js[start:end]
          forbidden = [
              r"innerHTML\s*=",
              r"insertAdjacentHTML\s*\(",
              r"\bon(?:click|change|input|error|load|submit|mouseover|focus|blur|keyup|keydown)\s*="
          ]
          hits = [pattern for pattern in forbidden if re.search(pattern, block, re.I)]
          if hits:
              raise SystemExit("Security regression: migrated package renderer still contains: " + ", ".join(hits))
          required = ["textContent", "createElement", "addEventListener", "data-package-index"]
          missing = [item for item in required if item not in block]
          if missing:
              raise SystemExit("Security regression: migrated package renderer missing: " + ", ".join(missing))
          print("OK: customer agency package renderer uses safe DOM/event APIs.")



      - name: Check migrated customer package detail modal
        shell: python
        run: |
          from pathlib import Path
          import re

          js = Path("script.js").read_text(encoding="utf-8")
          start_marker = "PACKAGE DETAIL / CUSTOMER BOOKING MODAL — XSS-safe DOM implementation"
          end_marker = "HOTELS PACKAGES IN AGENCY DASHBOARD"
          start = js.find(start_marker)
          end = js.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Security regression: package detail modal markers missing.")
          block = js[start:end]

          forbidden = [
              r"innerHTML\s*=",
              r"insertAdjacentHTML\s*\(",
              r"\bon(?:click|change|input|error|load|submit|mouseover|focus|blur|keyup|keydown)\s*="
          ]
          hits = [pattern for pattern in forbidden if re.search(pattern, block, re.I)]
          if hits:
              raise SystemExit("Security regression: package detail modal still contains: " + ", ".join(hits))

          required = ["textContent", "createElement", "addEventListener", "replaceChildren"]
          missing = [item for item in required if item not in block]
          if missing:
              raise SystemExit("Security regression: package detail modal missing: " + ", ".join(missing))

          print("OK: customer package detail/booking modal uses safe DOM APIs.")

      - name: Check global JavaScript security sinks and legacy sink budget
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [Path("script.js")] + list(Path(".").glob("*.js"))
          js = "\n".join(path.read_text(encoding="utf-8") for path in files if path.name != "security-dom.js")

          forbidden = {
              "eval()": r"\beval\s*\(",
              "new Function()": r"\bnew\s+Function\s*\(",
              "document.write()": r"\bdocument\.(?:write|writeln)\s*\(",
              "javascript: URL": r"javascript\s*:",
          }
          for name, pattern in forbidden.items():
              if re.search(pattern, js, re.I):
                  raise SystemExit(f"Security regression: forbidden {name} sink detected.")

          script = Path("script.js").read_text(encoding="utf-8")
          inner_html_count = len(re.findall(r"\.innerHTML\s*=", script))
          inline_handler_count = len(re.findall(
              r"\bon(?:click|change|submit|error|load|mouseover|focus|blur|input|keyup|keydown)\s*=",
              script,
              re.I,
          ))

          if inner_html_count > 145:
              raise SystemExit(f"Security regression: script.js innerHTML budget increased from 145 to {inner_html_count}.")
          if inline_handler_count > 158:
              raise SystemExit(f"Security regression: script.js inline-handler budget increased from 158 to {inline_handler_count}.")

          print(f"OK: forbidden JS sinks absent; legacy budget is innerHTML={inner_html_count}/145, inlineHandlers={inline_handler_count}/158.")

      - name: Validate all frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Check security headers and upload hardening
        shell: python
        run: |
          from pathlib import Path
          headers = Path("_headers").read_text(encoding="utf-8")
          script = Path("script.js").read_text(encoding="utf-8")

          required_headers = [
              "X-Frame-Options: DENY",
              "X-Content-Type-Options: nosniff",
              "Referrer-Policy: strict-origin-when-cross-origin",
              "Content-Security-Policy-Report-Only:",
              "script-src-attr 'none'",
              "object-src 'none'",
              "frame-ancestors 'none'",
          ]
          missing = [item for item in required_headers if item not in headers]
          if missing:
              raise SystemExit("Security regression: missing headers/CSP controls: " + ", ".join(missing))

          if "unsafe-eval" in headers:
              raise SystemExit("Security regression: unsafe-eval must not be allowed.")

          required_upload_controls = [
              "crypto.randomUUID()",
              "ALLOWED_DOCUMENT_TYPES",
              "validateUploadedFile",
              "file.type",
              "hotel-media",
          ]
          missing = [item for item in required_upload_controls if item not in script]
          if missing:
              raise SystemExit("Security regression: upload hardening missing: " + ", ".join(missing))

          print("OK: security headers, CSP report-only controls, and upload validation are present.")

      - name: Check externalized OneSignal bootstrap
        shell: python
        run: |
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          init = Path("onesignal-init.js").read_text(encoding="utf-8")
          if "<script>" in html and "OneSignal.init" in html:
              raise SystemExit("Security regression: OneSignal initialization returned to inline HTML.")
          for required in ["OneSignal.init", "__toursetuOneSignalReady", "OneSignalDeferred"]:
              if required not in init:
                  raise SystemExit(f"Security regression: missing OneSignal bootstrap control: {required}")
          print("OK: OneSignal bootstrap is externalized.")


      - name: Check migrated agency dashboard shell
        shell: python
        run: |
          from pathlib import Path
          import re

          source = Path("script.js").read_text(encoding="utf-8")
          start = source.index("function renderAgencyDashboard(user) {")
          end = source.index("window.loadAgencyVerificationBanner=async function(user){", start)
          block = source[start:end]

          forbidden = [
              r"\.innerHTML\s*=",
              r"\bon(?:click|change|input|error|load|submit|mouseover|focus|blur|keyup|keydown)\s*=",
              r'''setAttribute\(\s*['"]on''',
          ]
          for pattern in forbidden:
              if re.search(pattern, block, re.I):
                  raise SystemExit("Security regression: legacy DOM sink/inline handler in agency dashboard shell.")

          for required in ["createAgencyDashboardElement", "textContent", "addEventListener", "dataset.agencyTab", "app.replaceChildren"]:
              if required not in block:
                  raise SystemExit(f"Security regression: missing safe DOM control: {required}")

          banner_start = source.index("window.loadAgencyVerificationBanner=async function(user){")
          banner_end = source.index("\n\nwindow.showTab = async function", banner_start)
          banner = source[banner_start:banner_end]
          if re.search(r"\.innerHTML\s*=", banner) or re.search(r"\bon\w+\s*=", banner, re.I):
              raise SystemExit("Security regression: agency verification banner still uses unsafe dynamic DOM.")

          print("OK: agency dashboard shell and verification banner use safe DOM/event APIs.")

      - name: Check migrated agency showTab
        shell: python
        run: |
          from pathlib import Path
          import re

          source = Path("script.js").read_text(encoding="utf-8")
          start_marker = "function setAgencyTabMessage(container, message, style) {"
          start = source.index(start_marker)

          end = source.index("window.renderAgencyHotelPackages = async function()", start)
          block = source[start:end]

          forbidden = [
              r"\.innerHTML\s*=",
              r"\.innerText\s*=",
              r"\bon(?:click|change|input|error|load|submit|mouseover|focus|blur|keyup|keydown)\s*=",
              r'''setAttribute\(\s*['"]on''',
          ]
          for pattern in forbidden:
              if re.search(pattern, block, re.I):
                  raise SystemExit("Security regression: unsafe DOM sink/inline handler remains in agency showTab.")

          required = [
              "createAgencyDashboardElement",
              "textContent",
              "replaceChildren",
              "addEventListener",
              "dataset.agencyBookingAction",
              "window.showPackageForm",
              "window.renderAgencyHotelPackages",
          ]
          missing = [item for item in required if item not in block]
          if missing:
              raise SystemExit("Security regression: agency showTab missing safe control(s): " + ", ".join(missing))

          print("OK: agency showTab uses safe DOM/event APIs and delegated action data.")

      - name: Validate frontend JavaScript syntax
        shell: bash
        run: node --check script.js


      - name: Audit customer, agency, and hotel dashboard UI/UX + security contracts
        shell: python
        run: |
          from pathlib import Path
          import re

          js = Path("script.js").read_text(encoding="utf-8")
          css = Path("style.css").read_text(encoding="utf-8")

          # Customer hotel booking flow: saved hotel room image only; no generic
          # stock/fallback image is permitted in the booking modal.
          customer_start = js.find("window.loadCustomerHotelPackages = async function()")
          customer_end = js.find("function formatDateString", customer_start)
          if customer_start < 0 or customer_end < 0:
              raise SystemExit("Security regression: customer hotel inventory flow markers missing.")
          customer_block = js[customer_start:customer_end]
          for required in [
              "room_image",
              "getHotelRoomImageUrl",
              "openHotelBookingModal",
              "data-room-category-id",
              "addEventListener",
              "replaceChildren",
          ]:
              if required not in customer_block:
                  raise SystemExit("Customer hotel flow missing required control: " + required)
          if re.search(r"https://[^'"]*(?:unsplash|pexels|pixabay)\.", customer_block, re.I):
              raise SystemExit("Customer hotel booking flow contains a generic external stock image.")

          modal_start = js.find("window.openHotelBookingModal = function")
          modal_end = js.find("// 3. Calculation Handler", modal_start)
          if modal_start < 0 or modal_end < 0:
              raise SystemExit("Security regression: hotel booking modal markers missing.")
          modal = js[modal_start:modal_end]
          for forbidden in [
              r"innerHTML\s*=",
              r"insertAdjacentHTML\s*\(",
              r"javascript\s*:",
              r"on(?:click|change|input|submit|error|load)\s*=",
          ]:
              if re.search(forbidden, modal, re.I):
                  raise SystemExit("Hotel booking modal unsafe sink/inline handler: " + forbidden)
          for required in ["getHotelRoomImageUrl", "textContent", "createElement", "addEventListener", "safeRoomCategoryId"]:
              if required not in modal:
                  raise SystemExit("Hotel booking modal missing safe control: " + required)

          # Agency hotel stock flow must use the same saved room image and safe DOM.
          agency_start = js.find("window.renderAgencyHotelPackages = async function()")
          agency_end = js.find("window.renderAgencyDashboard", agency_start)
          if agency_start < 0 or agency_end < 0:
              raise SystemExit("Security regression: agency hotel flow markers missing.")
          agency_block = js[agency_start:agency_end]
          for required in ["room_image", "createElement", "textContent", "addEventListener"]:
              if required not in agency_block:
                  raise SystemExit("Agency hotel flow missing required control: " + required)

          # Hotel dashboard: upload validation + ownership checks + UI state controls.
          hotel_save = js.find("window.saveHotelProfile = async function")
          room_save = js.find("async function saveOrUpdateRoomCategory")
          if hotel_save < 0 or room_save < 0:
              raise SystemExit("Security regression: hotel save workflows missing.")
          hotel_save_block = js[hotel_save:room_save]
          room_save_end = js.find("// Alias for backwards compatibility", room_save)
          room_save_block = js[room_save:room_save_end if room_save_end > room_save else room_save + 20000]
          for required in ["validateUploadedFile", "hotel-media", "crypto.randomUUID()"]:
              if required not in hotel_save_block:
                  raise SystemExit("Hotel profile upload hardening missing: " + required)
          for required in ["owner_id", "ownedHotelId", ".eq('hotel_id', ownedHotelId)", "aria-busy"]:
              if required not in room_save_block:
                  raise SystemExit("Hotel room workflow security/UI control missing: " + required)

          # UI/UX regression contracts for the recently polished agency controls.
          for selector in [
              ".agency-create-package-btn",
              ".agency-package-edit-btn",
              "input[type=\"checkbox\"].agency-dashboard-checkbox",
              ".agency-vehicle-row",
              ".agency-vehicle-row:focus-within",
          ]:
              if selector not in css:
                  raise SystemExit("UI regression: missing required style contract: " + selector)

          print("OK: customer, agency, and hotel workflows retain feature contracts with UI/UX and security safeguards.")

      - name: Check safe DOM helper is present
        shell: python
        run: |
          from pathlib import Path
          js = Path("security-dom.js").read_text(encoding="utf-8")
          required = [
              "DOMPurify.sanitize",
              "textContent",
              "addEventListener",
              "setTrustedHTML",
          ]
          missing = [item for item in required if item not in js]
          if missing:
              raise SystemExit("Security regression: missing helper controls: " + ", ".join(missing))
          print("OK: safe DOM helper controls are present.")
