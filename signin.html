    <style>
        /* FORCE CALENDAR VISIBILITY & STYLE */
        input[type="date"] {
            appearance: auto !important;
            -webkit-appearance: listbox !important;
            min-height: 50px;
            cursor: pointer;
            background-color: #ffffff !important;
            color: #2d3436 !important;
            font-family: 'Inter', sans-serif;
            position: relative;
            border: 2px solid #ff9f43 !important;
            display: block !important;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Calendar Icon for Chrome/Edge/Windows 7 */
        input[type="date"]::-webkit-calendar-picker-indicator {
            background-color: #ff9f43;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            display: block !important;
            opacity: 1 !important;
        }

        #detail-modal {
            z-index: 999999 !important;
        }

        .modal-content {
            z-index: 1000000 !important;
        }

        /* Refund Policy Checkbox Styling */
        .policy-container {
            margin-top: 20px;
            padding: 15px;
            background: #fff5f5;
            border: 1px solid #ff7675;
            border-radius: 10px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .policy-container input {
            width: 20px !important;
            height: 20px !important;
            margin-top: 4px !important;
            cursor: pointer;
        }

        .select-email-btn { display:block; width:100%; margin:12px 0 0; padding:11px 14px; border:1px solid #ff9f43; border-radius:8px; background:#fff7ed; color:#b85b00; font:600 14px 'Inter',sans-serif; cursor:pointer; }
        .select-email-btn:hover { background:#ffedd5; }
        .password-toggle-btn { touch-action: manipulation; }

        /* Hotel Sidebar Styling */
        .nav-item {
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
            color: #d1d5db;
        }

        .nav-item:hover {
            background: #374151;
            color: #ffffff;
        }
    </style>
  <link rel="stylesheet" href="responsive.css?v=2026-11-16-partner-legal-acceptance-v1">

    <style id="toursetu-signin-layout-fix">
      html, body { min-height:100%; }
      body:not(.toursetu-dashboard-active) { display:grid !important; place-items:start center !important; padding:40px 16px !important; margin:0 !important; background:#f6f7fb !important; }
      body:not(.toursetu-dashboard-active) #app { display:block !important; width:min(100%,480px) !important; max-width:480px !important; margin:0 auto !important; padding:0 !important; background:transparent !important; border:0 !important; border-radius:0 !important; box-shadow:none !important; }
      body:not(.toursetu-dashboard-active) #app > .auth-card { width:100%; max-width:430px; margin:0 auto; padding:30px; background:#fff; border-radius:18px; box-shadow:0 12px 36px rgba(15,23,42,.10); }
      #form-title { text-align:center; color:#2d3436; margin:0 0 20px; font-size:28px; }
      #auth-section form { width:100%; }
      #auth-section input, #auth-section select { width:100%; min-height:48px; padding:12px 14px; border:1px solid #d8dee8; border-radius:9px; box-sizing:border-box; background:#fff; }
      #auth-section button#auth-btn { width:100%; min-height:48px; border:0; border-radius:9px; background:#ff9f43; color:#fff; font-weight:700; }
      #status { overflow-wrap:anywhere; }
      body.toursetu-dashboard-active { display:block !important; place-items:initial !important; width:100% !important; min-width:0 !important; min-height:100vh !important; padding:0 !important; margin:0 !important; overflow-x:hidden !important; background:#f5f7fb !important; }
      body.toursetu-dashboard-active #app { display:block !important; width:100% !important; max-width:none !important; min-height:100vh !important; margin:0 !important; padding:0 !important; background:transparent !important; border:0 !important; border-radius:0 !important; box-shadow:none !important; }
      body.toursetu-dashboard-active #app > .toursetu-agency-dashboard,
      body.toursetu-dashboard-active #app > .hotel-dashboard-shell { width:100% !important; max-width:none !important; min-height:100vh !important; margin:0 !important; }
      @media (min-width:769px) {
        body.toursetu-dashboard-active #app > .toursetu-agency-dashboard { display:flex !important; flex-direction:row !important; align-items:stretch !important; }
        body.toursetu-dashboard-active .toursetu-agency-dashboard > .agency-sidebar { flex:0 0 250px !important; width:250px !important; min-width:250px !important; height:100vh; position:sticky; top:0; }
        body.toursetu-dashboard-active .toursetu-agency-dashboard > .agency-main-content { flex:1 1 0 !important; width:auto !important; min-width:0 !important; max-width:none !important; min-height:100vh; overflow-x:hidden; }
        body.toursetu-dashboard-active #main-content > div[style*="display:grid"] { display:grid !important; grid-template-columns:repeat(3,minmax(0,1fr)) !important; width:100% !important; gap:clamp(12px,1.5vw,24px) !important; }
        body.toursetu-dashboard-active #main-content > div[style*="display:grid"] > div { min-width:0 !important; overflow-wrap:anywhere; }
      }
      .toursetu-agency-mobile-menu, .toursetu-agency-mobile-backdrop { display:none; }
      @media (max-width:768px) {
        body:not(.toursetu-dashboard-active) { padding:18px 12px !important; }
        body:not(.toursetu-dashboard-active) #app > .auth-card { padding:22px 18px; }
        body.toursetu-dashboard-active #app { padding:0 !important; }
        body.toursetu-dashboard-active #app > .toursetu-agency-dashboard { display:block !important; width:100% !important; margin:0 !important; padding:0 !important; }
        body.toursetu-dashboard-active .toursetu-agency-dashboard > .agency-sidebar { position:fixed !important; inset:0 auto 0 0 !important; z-index:1001 !important; width:min(84vw,300px) !important; min-width:0 !important; height:100dvh !important; overflow-y:auto !important; transform:translateX(-105%); transition:transform .24s ease; box-shadow:12px 0 36px rgba(0,0,0,.24); }
        body.toursetu-dashboard-active.toursetu-mobile-nav-open .toursetu-agency-dashboard > .agency-sidebar { transform:translateX(0); }
        body.toursetu-dashboard-active .toursetu-agency-dashboard > .agency-main-content { width:100% !important; max-width:none !important; min-width:0 !important; padding:76px 14px 24px !important; overflow-x:hidden !important; }
        body.toursetu-dashboard-active #main-content > div[style*="display:grid"] { display:grid !important; grid-template-columns:minmax(0,1fr) !important; width:100% !important; gap:14px !important; }
        body.toursetu-dashboard-active #main-content > div[style*="display:grid"] > div { width:100% !important; min-width:0 !important; }
        body.toursetu-dashboard-active .toursetu-agency-mobile-menu { display:flex !important; position:fixed !important; top:max(12px,env(safe-area-inset-top)) !important; left:max(12px,env(safe-area-inset-left)) !important; z-index:1002 !important; width:48px !important; height:48px !important; min-height:48px !important; align-items:center !important; justify-content:center !important; border:0 !important; border-radius:12px !important; background:#2d3436 !important; color:#fff !important; box-shadow:0 4px 16px rgba(0,0,0,.18); font-size:22px !important; }
        body.toursetu-dashboard-active .toursetu-agency-mobile-backdrop { display:block; position:fixed; inset:0; z-index:1000; border:0; padding:0; background:rgba(15,23,42,.55); }
        body.toursetu-dashboard-active:not(.toursetu-mobile-nav-open) .toursetu-agency-mobile-backdrop { display:none !important; }
      }
      @media (prefers-reduced-motion:reduce) { body.toursetu-dashboard-active .toursetu-agency-dashboard > .agency-sidebar { transition:none !important; } }
    </style>

</head>

<body>

<a class="skip-link" href="#app">Skip to main content</a>

<div id="app" role="main">
    <div class="auth-card">
        <h1 id="form-title">🌍 Tour<span style="color: #ff9f43;">Setu</span></h1>
        <div id="auth-section">
            <form id="loginForm" autocomplete="on" data-ts-csp-submit="handleAuth()">
            <input type="email" id="email" name="email" placeholder="Email Address" autocomplete="username" inputmode="email" aria-label="Email Address">
            <div class="password-wrapper" style="position: relative; width: 100%; display: block;">
              <input type="password" id="loginPassword" name="password" placeholder="Password" autocomplete="current-password" aria-label="Password" style="width:100%;padding-right:42px;box-sizing:border-box;">
              <button type="button" id="toggleLoginPassword" class="password-toggle-btn" aria-label="Show password" aria-pressed="false" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);width:auto;height:auto;background:none;border:none;padding:4px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
            </div>
            


            <div id="business-fields" style="display:none; margin-top:10px; border-top:1px solid #eee; padding-top:10px;">
                <input type="text" id="gst-no" placeholder="GST Number">
                <input type="text" id="biz-reg" placeholder="Business Registration No.">
                <input type="text" id="biz-lic" placeholder="Trade License / License No.">
                <p style="font-size:0.75rem; color:#666; margin-top:5px;">
                    Note: Partner accounts require verification to go public.
                </p>
            </div>

            <button id="auth-btn" type="submit">Create Account</button>
            </form>
            
            <p id="toggle-text">
                Already have an account? <a href="#" id="toggle-mode-link">Login here</a>
            </p>
        </div>
        
        <div id="status" style="margin-top:15px; font-weight:bold;"></div>

    </div>
</div>

<!-- LIVE HOTEL INVENTORY CONTAINER (JS will render items here) -->
<div id="live-hotel-inventory-list"></div>

<!-- Hotel Owner Dashboard UI (Initially Hidden) -->
<div id="owner-dashboard-section" style="display: none; max-width: 800px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2>Incoming Booking Requests</h2>
    
    <!-- Refresh Button -->
    <button id="owner-refresh-btn" style="padding: 10px 15px; background: #ff9f43; color: white; border: none; border-radius: 6px; cursor:pointer;">
        🔄 Fetch/Refresh Requests
    </button>

    <!-- Requests Display List -->
    <div id="owner-requests-list" style="margin-top: 15px;">
        <!-- Javascript dynamic cards yahan render karega -->
    </div>
</div>

<div id="detail-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:start; overflow-y:auto; padding:20px;">
    <div class="modal-content card" style="background:white; width:100%; max-width:750px; padding:30px; border-radius:20px; position:relative; margin: 40px auto;">
        <div id="detail-view-body"></div>
    </div>
</div>
